<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pointing springer spaniel bird dog favicon">
  <defs>
    <linearGradient id="field" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123f2b"/>
      <stop offset="1" stop-color="#1f5d42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#07180f" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#field)"/>
  <path d="M13 96c16-9 32-12 49-10 19 2 35 1 53-9v19H13z" fill="#d8c37a" opacity="0.30"/>
  <g filter="url(#shadow)">
    <!-- tail: high and locked, classic pointing posture -->
    <path d="M86 54c11-10 22-17 32-21 3-1 5 3 2 5-8 6-19 14-31 27z" fill="#f4ead2" stroke="#2a170f" stroke-width="5" stroke-linejoin="round"/>
    <!-- rear body / feathering -->
    <path d="M34 72c6-15 19-24 37-24 19 0 30 10 28 24-2 16-16 24-36 23-19-1-34-8-29-23z" fill="#f7efe0" stroke="#2a170f" stroke-width="5" stroke-linejoin="round"/>
    <!-- liver spaniel saddle patches -->
    <path d="M47 54c8-5 17-6 27-3-7 7-10 16-8 28-12 0-21-3-27-9 1-7 4-12 8-16z" fill="#6b3b22"/>
    <path d="M77 55c11 4 17 10 17 19-7 5-15 7-24 5 1-10 3-18 7-24z" fill="#6b3b22" opacity="0.95"/>
    <!-- neck and head pointing right -->
    <path d="M84 55c8-10 18-14 28-9 6 3 8 9 5 15-4 8-16 11-29 8z" fill="#f7efe0" stroke="#2a170f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M102 46c6 0 12 4 15 10-6 1-13-1-19-5z" fill="#6b3b22"/>
    <!-- long springer ear -->
    <path d="M91 51c-4 7-5 17-2 27 7-2 12-9 12-17 0-7-3-11-10-10z" fill="#5a2f1c" stroke="#2a170f" stroke-width="3" stroke-linejoin="round"/>
    <!-- muzzle / nose -->
    <path d="M113 55l9 3-9 5z" fill="#2a170f"/>
    <circle cx="104" cy="54" r="2.4" fill="#102016"/>
    <!-- front pointing leg -->
    <path d="M78 74c10 3 17 8 22 16" stroke="#2a170f" stroke-width="7" stroke-linecap="round"/>
    <path d="M78 74c10 3 17 8 22 16" stroke="#f7efe0" stroke-width="4" stroke-linecap="round"/>
    <!-- standing legs -->
    <path d="M47 83l-8 24M69 84l-2 25" stroke="#2a170f" stroke-width="8" stroke-linecap="round"/>
    <path d="M47 83l-8 24M69 84l-2 25" stroke="#f7efe0" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 107h14M61 109h14" stroke="#2a170f" stroke-width="5" stroke-linecap="round"/>
    <!-- small quail/bird cue in pointing direction -->
    <path d="M111 31c4-5 8-5 12 0-5-1-8 0-12 0z" fill="#d8c37a" opacity="0.95"/>
    <path d="M108 30c-3-5-1-9 4-11-1 4-1 7 1 10z" fill="#f4ead2" opacity="0.9"/>
  </g>
</svg>
