name: Deploy Waynesboro OS to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Nightly public-data refresh/build. GitHub cron runs in UTC (4:30 AM Eastern during daylight time).
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run civic source-ranking tests
        run: npm run test:civic-ranking

      - name: Refresh nightly public weather snapshot
        run: npm run fetch:weather

      - name: Verify weather tape freshness
        run: npm run qa:weather-fresh

      - name: Run public-release audit before build
        run: npm run audit:public

      - name: Build public site
        run: npm run build
        env:
          ASTRO_SITE: https://bmassey-brannen.github.io
          ASTRO_BASE: /waynesboro-os

      - name: Run public-release audit after build
        run: npm run audit:public

      - name: Preview built site for route QA
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/waynesboro-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/waynesboro-os/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/waynesboro-preview.log
          exit 1

      - name: Run public route render QA
        run: npm run qa:routes -- http://127.0.0.1:4321/waynesboro-os

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
