name: Deploy Waynesboro OS to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 6:30 AM Eastern during daylight time; GitHub cron runs in UTC.
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run civic source-ranking tests
        run: npm run test:civic-ranking

      - name: Build public site
        run: npm run build
        env:
          ASTRO_SITE: https://bmassey-brannen.github.io
          ASTRO_BASE: /waynesboro-os

      - name: Run public-release audit
        run: npm run audit:public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
